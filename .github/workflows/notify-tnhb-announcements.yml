name: TNHB Announcements Notifier

on:
  workflow_dispatch: # To trigger the action from REST API
  # At 04:30 AM UTC (10:00 AM IST) everyday.
  schedule:
    - cron: "30 4 * * *"

jobs:
  notify-tnhb-announcements:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm" # Cache node_modules

      - name: Install Dependencies
        run: npm ci

      - name: Restore Cached Response
        id: restore-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/tnhb-announcements.json
          # Exact key is etag-based (tnhb-<etag>) and written by the save step.
          # `tnhb-announcements-current` never matches exactly, so this always
          # falls back to the most recent `tnhb-*` entry via restore-keys.
          key: tnhb-announcements-current
          restore-keys: |
            tnhb-

      - name: Notify
        id: notify
        run: npm run general:notify-tnhb-announcements
        env:
          TNHB_ANNOUNCEMENTS_API_URL: ${{ vars.TNHB_ANNOUNCEMENTS_API_URL }}
          TELEGRAM_API_TOKEN: ${{ secrets.TELEGRAM_API_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TNHB_TELEGRAM_CHAT_ID }}

      - name: Save Cached Response
        if: ${{ steps.notify.outputs.changed == 'true' && steps.notify.outputs.cache_key != '' }}
        uses: actions/cache/save@v4
        with:
          path: .cache/tnhb-announcements.json
          key: ${{ steps.notify.outputs.cache_key }}
